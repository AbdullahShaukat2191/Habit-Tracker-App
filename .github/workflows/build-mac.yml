name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-dmg
          path: release/*.dmg
